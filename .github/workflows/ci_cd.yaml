name: "Pipeline de integracao"

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  integracao:
    name: "Testes, analise e Docker"
    runs-on: ubuntu-latest

    steps:
      - name: "Baixar o repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Instalar dependencias"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Executar testes"
        env:
          PYTHONPATH: app
        run: pytest -v

      - name: "Verificar cobertura"
        env:
          PYTHONPATH: app
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: "Executar analise de seguranca"
        run: bandit -r app/

      - name: "Executar linting"
        run: pylint app/ || true

      - name: "Validar Docker Compose"
        run: docker compose config --quiet

      - name: "Construir imagem Docker"
        run: docker build -t devops-api:test .