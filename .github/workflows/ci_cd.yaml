name: "Pipeline CI/CD"

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  integracao:
    name: "Testes, analise, Docker e Kubernetes"
    runs-on: ubuntu-latest

    steps:
      - name: "Baixar o repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Instalar dependencias"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Executar testes"
        env:
          PYTHONPATH: app
        run: pytest -v

      - name: "Verificar cobertura"
        env:
          PYTHONPATH: app
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: "Executar analise de seguranca"
        run: bandit -r app/

      - name: "Executar linting"
        run: pylint app/ || true

      - name: "Validar Docker Compose"
        run: docker compose config --quiet

      - name: "Construir imagem Docker"
        run: docker build -t devops-api:test .

      - name: "Configurar Kubeconform"
        uses: bmuschko/setup-kubeconform@v1
        with:
          kubeconform-version: "0.7.0"

      - name: "Validar manifesto Kubernetes"
        run: kubeconform -strict -summary deployment.yaml

  teste-kubernetes:
    name: "Teste no Kubernetes"
    runs-on: ubuntu-latest
    needs: integracao

    steps:
      - name: "Baixar o repositorio"
        uses: actions/checkout@v4

      - name: "Criar cluster Kind"
        uses: helm/kind-action@v1
        with:
          cluster_name: devops-teste
          wait: 120s

      - name: "Aplicar manifesto"
        run: kubectl apply -f deployment.yaml

      - name: "Aguardar os deployments"
        run: |
          kubectl rollout status deployment/tarefas --timeout=180s
          kubectl rollout status deployment/notificacao --timeout=180s
          kubectl rollout status deployment/gateway --timeout=180s

      - name: "Testar o gateway"
        run: |
          kubectl port-forward service/gateway 8080:80 > /tmp/gateway.log 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill ${PORT_FORWARD_PID}' EXIT

          curl --fail --silent --show-error \
            --retry 10 \
            --retry-delay 2 \
            --retry-connrefused \
            http://127.0.0.1:8080/

          curl --fail --silent --show-error \
            http://127.0.0.1:8080/tarefas

          curl --fail --silent --show-error \
            --request POST \
            "http://127.0.0.1:8080/tarefas?titulo=Pipeline&descricao=Teste%20Kubernetes"

          curl --fail --silent --show-error \
            --request PUT \
            "http://127.0.0.1:8080/tarefas/1?titulo=Pipeline&descricao=Teste%20Kubernetes&concluido=true"

      - name: "Exibir recursos Kubernetes"
        if: always()
        run: |
          kubectl get deployments
          kubectl get pods
          kubectl get services

      - name: "Exibir logs em caso de falha"
        if: failure()
        run: |
          kubectl logs deployment/tarefas --tail=100 || true
          kubectl logs deployment/notificacao --tail=100 || true
          kubectl logs deployment/gateway --tail=100 || true

  entrega:
    name: "Publicacao no Docker Hub"
    runs-on: ubuntu-latest
    needs:
      - integracao
      - teste-kubernetes
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: "Baixar o repositorio"
        uses: actions/checkout@v4

      - name: "Autenticar no Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Configurar QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Configurar Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Construir e publicar imagem"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devops-api:latest
            ${{ vars.DOCKERHUB_USERNAME }}/devops-api:${{ github.sha }}