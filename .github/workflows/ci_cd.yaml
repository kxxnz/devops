name: "Pipeline CI/CD"

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  integracao:
    name: "Testes, analise, Docker e Kubernetes"
    runs-on: ubuntu-latest

    steps:
      - name: "Baixar o repositorio"
        uses: actions/checkout@v4

      - name: "Configurar Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Instalar dependencias"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Executar testes"
        env:
          PYTHONPATH: app
        run: pytest -v

      - name: "Verificar cobertura"
        env:
          PYTHONPATH: app
        run: |
          pytest \
            --cov=app \
            --cov-report=term-missing \
            --cov-fail-under=80

      - name: "Executar analise de seguranca"
        run: bandit -r app/

      - name: "Executar linting"
        run: pylint app/ || true

      - name: "Validar Docker Compose"
        run: docker compose config --quiet

      - name: "Construir imagem Docker"
        run: docker build -t devops-api:test .

      - name: "Configurar Kubeconform"
        uses: bmuschko/setup-kubeconform@v1
        with:
          kubeconform-version: "0.7.0"

      - name: "Validar manifesto Kubernetes"
        run: kubeconform -strict -summary deployment.yaml

  entrega:
    name: "Publicacao no Docker Hub"
    runs-on: ubuntu-latest
    needs: integracao
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: "Baixar o repositorio"
        uses: actions/checkout@v4

      - name: "Autenticar no Docker Hub"
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Configurar QEMU"
        uses: docker/setup-qemu-action@v3

      - name: "Configurar Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Construir e publicar imagem"
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/devops-api:latest
            ${{ vars.DOCKERHUB_USERNAME }}/devops-api:${{ github.sha }}