services:
  gateway:
    image: nginx:alpine
    container_name: devops-gateway
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      tarefas:
        condition: service_healthy
      notificacao:
        condition: service_healthy
    restart: unless-stopped

  tarefas:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-tarefas
    command:
      - python
      - -m
      - uvicorn
      - main:APP
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
    environment:
      URL_NOTIFICACAO: http://gateway/notificacao
      LOG_LEVEL: DEBUG
    ports:
      - "8001:8001"
    volumes:
      - ./app:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  notificacao:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-notificacao
    command:
      - python
      - -m
      - uvicorn
      - notificacao:APP
      - --host
      - 0.0.0.0
      - --port
      - "8002"
      - --reload
    ports:
      - "8002:8002"
    volumes:
      - ./app:/app
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8002/docs')"
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped